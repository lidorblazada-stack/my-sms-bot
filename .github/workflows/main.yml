name: Cyber-Shield Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-main-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install discord.py firebase-admin

      - name: Start Shield Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python main.py

  run-alt-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install discord.py

      - name: Start Alt Detector
        env:
          # הגדרתי את שתי האופציות כדי שהקוד יזהה את הטוקן בטוח
          TOKEN: ${{ secrets.ALT_BOT_TOKEN }}
          ALT_BOT_TOKEN: ${{ secrets.ALT_BOT_TOKEN }}
        run: python alts.py
