name: Cyber-Shield Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install discord.py firebase-admin

      - name: Create Firebase JSON
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Start Both Bots
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          ALT_BOT_TOKEN: ${{ secrets.ALT_BOT_TOKEN }}
        run: |
          # הרצה של שניהם בצורה שמשאירה לוגים חיים
          python alts.py & python main.py
