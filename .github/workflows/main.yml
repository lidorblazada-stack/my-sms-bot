name: Run Both Bots 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-main-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install discord.py
      - name: Start Shield Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python main.py

  run-alt-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install discord.py
      - name: Start Alt Detector
        env:
          ALT_BOT_TOKEN: ${{ secrets.ALT_BOT_TOKEN }}
        run: python alts.py
